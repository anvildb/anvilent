[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anvilent"
version = "0.1.0"
description = "Python client driver for Anvil DB"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/devforge/devforge-graph"
Documentation = "https://github.com/devforge/devforge-graph/tree/master/anvilent/python"

[tool.hatch.build.targets.wheel]
packages = ["src/anvilent"]
