[package]
name = "anvilent"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Official Rust client driver for Anvil DB"
authors = ["Benjamin C. Tehan <purphoros@devforge.org>"]
repository = "https://github.com/anvildb/anvilent"
keywords = ["anvil", "graph-database", "cypher", "driver"]
categories = ["database"]

[workspace]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
thiserror = "2"
url = "2"
